# What CodeWeavers' own winecoreaudio.so for this Wine has (otool -l), so ours matches.
MIN=14.0
RPATH2=@loader_path/../../../lib/x86_64
RPATH2_ARM64=@loader_path/../../../lib/aarch64
# The FEX side's ntdll.so carries these patches only: the others change what Rosetta
# shows a game (0017, 0019, 0020) or route a process to D3DMetal (0018).
# 0026 is macOS's socket options, not Rosetta's: the FEX side's Wine meets the same kernel.
# 0027 is its switch.
# 0037 (TCP connections without TCP options, on request) is macOS's socket options too.
NTDLL_ARM64="0021-ntdll-timer-relative-overflow.patch 0022-ntdll-aarch64-unaligned-iosb-status.patch 0026-ntdll-dualstack-ipv4-options.patch 0027-ntdll-dualstack-ipv4-options-switch.patch 0037-ntdll-tcp-noopt-on-request.patch"
# 0023 changes ntdll's PE half too: the Intel side ships ntdll.so and ntdll.dll as a pair.
NTDLL_DLL=yes
# 0033-0035 change modules CrossOver ships unpatched: kernelbase.dll, user32.dll and win32u.so
# (2XKO's copy protection and the Riot Client's window).
PROTECTION_MODULES=yes
# 0039 and 0040 change two more modules CrossOver ships unpatched: dwrite.dll and
# directmanipulation.dll (a program built on GPUI finds its fonts and opens its window).
WINDOW_MODULES=yes
