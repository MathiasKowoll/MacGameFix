# What CodeWeavers' own winecoreaudio.so for this Wine has (otool -l), so ours matches.
MIN=10.15
RPATH2=@loader_path/../../../lib64
# CrossOver 26.3 has no FEX (arm64) side: no RPATH2_ARM64.
# CodeWeavers' ntdll.so for this Wine uses libunwind (nm -u: unw_*); ours must too.
UNWIND=yes
# No NTDLL_DLL: none of this series' patches changes ntdll's PE half. wine-11.21's do
# (0023, FH6's exception dispatcher, and 0031), and are not in this series.
# 0033-0035 change modules CrossOver ships unpatched: kernelbase.dll, user32.dll and win32u.so
# (2XKO's copy protection and the Riot Client's window). 0041 adds a function to kernelbase.dll
# and its forward to kernel32.dll, which is built with it (EA SPORTS FC 27's activation).
# 0043 changes win32u.so too (Forza Horizon 5's Xbox sign-in window).
PROTECTION_MODULES=yes
# CodeWeavers' 26.3 win32u.so opens FreeType as libfreetype.dylib (strings), a link to
# lib64/libfreetype.6.dylib; ours asks for it by the same name.
FREETYPE_SONAME=libfreetype.dylib
# 0039 and 0040 change two more modules CrossOver ships unpatched: dwrite.dll and
# directmanipulation.dll (a program built on GPUI finds its fonts and opens its window).
WINDOW_MODULES=yes
