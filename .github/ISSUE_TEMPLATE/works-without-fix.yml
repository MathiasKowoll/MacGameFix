name: Works without its fix
description: A game that MacGameFix has a fix for now works without it, on a newer Game Porting Toolkit or CrossOver, so the fix can be marked as no longer needed there.
title: "[No longer needed] "
labels: ["works-without-fix"]
body:
  - type: markdown
    attributes:
      value: |
        This is how a game gets "Fixed by D3DMetal from GPTK …" on its page. It counts only if the fix was
        removed first: a game that works with its fix still installed shows nothing about the fix.
        Remove it from the **Games** tab (**Remove Selected**) and play. Then select the game and click
        **Works Without the Fix…**, under the table: it saves the report and opens this form with the game
        and the versions filled in.
  - type: input
    id: game
    attributes:
      label: Game
      description: Its name, and its Steam app id if you know it.
    validations:
      required: true
  - type: input
    id: toolkit
    attributes:
      label: Game Porting Toolkit (D3DMetal)
      description: The version it works on without the fix, such as 4.0b3.
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: MacGameFix, CrossOver or the NotProton runner and its build, macOS, and your Mac's chip.
    validations:
      required: true
  - type: textarea
    id: played
    attributes:
      label: What you played
      description: Where in the game and for how long, including the moment the fix was for.
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: MacGameFix's log
      description: The lines from Settings › Log that show the fix removed, then the session.
      render: text
    validations:
      required: true
  - type: textarea
    id: report
    attributes:
      label: The report
      description: Attach the file Works Without the Fix… saved (MacGameFix report without the fix - <game> - <date>.md), made after playing without the fix. An app without that button - the file the Report tab saves for the game.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots or a recording
      description: The moment the fix was for, working without it.
  - type: checkboxes
    id: confirm
    attributes:
      label: Before you send it
      options:
        - label: The fix was removed before I played, and MacGameFix showed the game as not installed.
          required: true
        - label: I played the moment the fix was for, not just the start of the game.
          required: true
