# NotProton plugin template, for notproton-plugins.sh: Forza Horizon 5.
#
# One row of the game's own, a patch of CodeWeavers' win32u.so in memory, for the Xbox sign-in.
# The sign-in page is drawn by a WebView2 process into a window of the game's. CodeWeavers flush
# such a window's surface by sending a message to the other process (CX HACK 23950), and
# window_surface_set_shape flushed it while apply_window_pos held the USER lock: Wine's check
# for that ("BUG: holding USER lock") stopped the browser process, and the game closed two
# seconds later. engine/README.md, "Forza Horizon 5: the Xbox sign-in window", has the stack.
#
# The patch: window_surface_set_shape ends "unlock; ...; pop rbp; jmp window_surface_flush".
# The jump becomes a return (e9 -> c3), so the shape is flushed by the message loop's own flush
# a moment later, where no lock is held, as every other draw is. The lock's check is unchanged.
# The form is found once in the win32u.so of CrossOver Preview 41303 (e4bf8095, at 0x175d6) and
# once in the Wine modules' (5e272d81), which has the fix in its source too (engine patch 0043).
# Another build needs a form of its own; where none is found, NotProton says so and patches
# nothing. x86_64 only: NotProton does not patch arm64 code.
[NOTPROTON_MGF_FH5_SIGNIN]
label = Xbox sign-in window
description = Keeps the Xbox sign-in page from closing the game. Leave it on
on = 1
tools = notproton-fex-rosetta*
patch = win32u.so/x86_64: 48 8d 7b 38 e8 ?? ?? ?? ?? 48 89 df 48 83 c4 08 5b 41 5e 41 5f 5d e9=c3 ?? ?? ?? ??
