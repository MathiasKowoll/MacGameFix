# NotProton plugin template, for notproton-plugins.sh: Forza Horizon 6.
# FH6 has no row of its own: it uses MacGameFix's shared "Engine fixes" row (np-plugin-shared.conf),
# whose library, mgf-engine.dylib, arms in this game alone engine patches 0021 (the threadpool's
# timer thread kept from spinning) and 0026 (IPv4 options on its online sessions' dual-stack
# socket), from outside ntdll. This file keeps what the game's descriptor records beyond it.
