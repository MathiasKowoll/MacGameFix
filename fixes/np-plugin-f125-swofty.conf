# NotProton plugin template, for notproton-plugins.sh: F1 25 through Swofty Launcher.
# No row loads or changes anything by itself: a row's value is a variable NotProton
# keeps in the game's launch options, and f125-swofty-play.sh, which stands before
# %command% there, reads it. The first row is the fix's switch; the second chooses what
# Play opens; the third which of Swofty's profiles a start plays. Rosetta tools only: that
# is where the game was played. Every description ends with where the row was played, as
# every MacGameFix row in NotProton's panel does.
# install-f125-swofty.sh adds "group = MacGameFix · F1 25" to each row where NotProton knows
# groups, so the game's options stand together on its Compatibility page.
[NOTPROTON_MGF_F125_SWOFTY]
label = Start through Swofty Launcher (MacGameFix)
description = Steam's Play starts F1 25 through Swofty Launcher: offline, without EA AntiCheat or multiplayer. Off, Play starts the game's own launcher, which does not open on a Mac. Played on NotProton, CrossOver Preview 41303 on Rosetta (D3DMetal 4.0b3), 2026-11-23
on = 1
requires = Library/Application Support/MacGameFix/swofty/launcher/bin/swofty.exe
tools = notproton-fex-rosetta*
[NOTPROTON_MGF_F125_OPENS]
label = Play opens (MacGameFix)
description = The game, with Swofty's active profile, or Swofty Launcher's window, to turn addons on and off, install mods and choose the profile. Its own Play starts the game too. Played on NotProton, CrossOver Preview 41303 on Rosetta (D3DMetal 4.0b3), 2026-11-23
type = choice
default = game
choice = game = The game
choice = window = Swofty Launcher's window
depends = NOTPROTON_MGF_F125_SWOFTY
tools = notproton-fex-rosetta*
[NOTPROTON_MGF_F125_PROFILE]
label = Profile (MacGameFix)
description = Which of Swofty's profiles Play starts the game with: the active one, with your addons and mods, or vanilla, the game with no addons and no mod loader, to tell whether a problem comes from a mod. Only when Play opens the game. Played on NotProton, CrossOver Preview 41303 on Rosetta (D3DMetal 4.0b3), 2026-11-23
type = choice
default = active
choice = active = Swofty's active profile
choice = vanilla = Vanilla, without mods
depends = NOTPROTON_MGF_F125_SWOFTY
tools = notproton-fex-rosetta*
