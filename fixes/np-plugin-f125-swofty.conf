# NotProton plugin template, for notproton-plugins.sh: F1 25 through Swofty Launcher.
# F1 25 has no row of its own: it uses MacGameFix's shared rows (np-plugin-shared.conf), as few
# as NotProton's 32 for every game allow: "Engine fixes", for its memory; "Start through the mod
# tool", the switch f125-swofty-play.sh reads, which stands before %command% in the launch
# options; "Play opens": the game, the game with Wine's exception notes, or Swofty Launcher's
# window; and "Mod profile": Swofty's active profile, vanilla, or one of Swofty's profiles by
# name, which install-f125-swofty.sh reads from Swofty's folder in the prefix.
# This file keeps what the game's descriptor records beyond them.
