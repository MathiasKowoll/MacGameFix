# NotProton plugin template, for notproton-plugins.sh: F1 25 through Swofty Launcher.
# Two rows, as few as NotProton's 32 for every game allow. The first is the fix's switch, and
# loads nothing: a row's value is a variable NotProton keeps in the game's launch options, and
# f125-swofty-play.sh, which stands before %command% there, reads it. The second chooses what
# Play opens: the game with Swofty's active profile, the game without mods, or Swofty Launcher's
# window. The game's memory fix is in the shared engine row (np-plugin-engine.conf), which the
# install switches on for this game. Rosetta tools only: that is where the game was played.
# Every description ends with where the row was played, as every MacGameFix row in NotProton's
# panel does.
# install-f125-swofty.sh adds "group = MacGameFix · F1 25" to each row where NotProton knows
# groups, so the game's options stand together on its Compatibility page.
# retired = mgf-low-allocations.dylib e97d6b3bc9cb8e162a5cc400aa7301882d53292111ad2453883ec7b3b0e9a6a3
[NOTPROTON_MGF_F125_SWOFTY]
label = Start through Swofty Launcher (MacGameFix)
description = Steam's Play starts F1 25 through Swofty Launcher: offline, without EA AntiCheat or multiplayer. Off, Play starts the game's own launcher, which does not open on a Mac. Played on NotProton, CrossOver Preview 41303 on Rosetta (D3DMetal 4.0b3), 2026-11-23
on = 1
requires = Library/Application Support/MacGameFix/swofty/launcher/bin/swofty.exe
tools = notproton-fex-rosetta*
[NOTPROTON_MGF_F125_PLAY]
label = Play opens (MacGameFix)
description = The game with Swofty's active profile, your addons and mods; the game without mods (Swofty's vanilla profile, no addons, no mod loader), to tell whether a problem comes from a mod; or Swofty Launcher's window, to turn addons on and off, install mods and choose the active profile. Its own Play starts the game too. Played on NotProton, CrossOver Preview 41303 on Rosetta (D3DMetal 4.0b3), 2026-11-24
type = choice
default = game
choice = game = The game
choice = vanilla = The game without mods
choice = window = Swofty Launcher's window
depends = NOTPROTON_MGF_F125_SWOFTY
tools = notproton-fex-rosetta*
