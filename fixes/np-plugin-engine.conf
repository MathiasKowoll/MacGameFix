# NotProton plugin template for MacGameFix's shared engine row. notproton-plugins.sh writes it
# into plugins/mgf-engine.conf, with "apps" for every game whose fix uses it and a group where
# NotProton knows groups; the game's installer passes this file and the library as
# NP_ENGINE_TEMPLATE and NP_ENGINE_LIBRARY. One row for every game, because NotProton reads at
# most 32 rows for all games together: the library (engine/mgf-engine.c) arms each game's fixes
# in that game alone. Rosetta tools only: that is where the fixes were played.
[NOTPROTON_MGF_ENGINE]
label = Engine fixes (MacGameFix)
description = The Wine fixes this game needs that Wine itself lacks, armed in this game alone by one MacGameFix library: for F1 25 its memory is kept where Windows puts it, for EA SPORTS FC 27 the function its activation asks for is added. Off, those games close or refuse to start. Leave it on. Played on NotProton, CrossOver Preview 41303 on Rosetta (D3DMetal 4.0b3), 2026-11-24
on = 1
inject = 1
requires = Library/Application Support/notproton/plugins/mgf-engine.dylib
tools = notproton-fex-rosetta*
