# NotProton plugin template, for notproton-plugins.sh: EA SPORTS FC 27 with FC 27 Live Editor.
# Two rows, as few as NotProton's 32 for every game allow. The first is the fix's switch, and
# it does two things while it is on. NotProton loads mgf-d3dmetal-hookable.dylib into the game,
# without which the game closes the moment Live Editor puts its DirectX hooks in
# (d3dmetal-hookable/mgf-d3dmetal-hookable.c). And fc27-le-play.sh, which stands before
# %command% in the launch options, reads the row's variable there and starts the game with Live
# Editor instead of handing Steam's command on. The second chooses what Play opens: the game,
# the game with Wine's exception notes for a report, or Live Editor's launcher window. The
# function the game's activation asks for is in the shared engine row (np-plugin-engine.conf),
# which the install switches on for this game. Rosetta tools only: the library rewrites x86-64
# code, and that is where the game was played. Every description ends with where the row was
# played, as every MacGameFix row in NotProton's panel does.
# install-fc27-live-editor.sh adds "group = MacGameFix · FC 27" to each row where NotProton
# knows groups, so the game's options stand together on its Compatibility page.
# library = mgf-d3dmetal-hookable.dylib
# retired = mgf-package-family.dylib 6010959c9ca7743ce0e64d9e21d4884e47db9529a9af6399dabf942367b35057
[NOTPROTON_MGF_FC27_LE]
label = Start with Live Editor (MacGameFix)
description = Steam's Play starts EA SPORTS FC 27 with FC 27 Live Editor, a mod tool you provide: offline, without EA AntiCheat or online modes. It also loads the library that rewrites D3DMetal's Direct3D method stubs into a form Live Editor's in-game window can hook; without it the game closes the moment the window goes in. Off, Play starts the game's own launcher, which starts nothing on a Mac. Played on NotProton, CrossOver Preview 41303 on Rosetta (D3DMetal 4.0b3), 2026-11-23
on = 1
inject = 1
requires = Library/Application Support/notproton/plugins/mgf-d3dmetal-hookable.dylib
tools = notproton-fex-rosetta*
[NOTPROTON_MGF_FC27_PLAY]
label = Play opens (MacGameFix)
description = The game with Live Editor in it (F9 shows its window); the same with Wine writing every exception the game raises to NotProton's Wine log, for one start to report a game that closes (the log grows fast and the game starts slower); or Live Editor's launcher window alone, to look at its settings before a session: close that window and set this back to play. Played on NotProton, CrossOver Preview 41303 on Rosetta (D3DMetal 4.0b3), 2026-11-24
type = choice
default = game
choice = game = The game
choice = trace = The game, with exception notes for a report
choice = window = Live Editor's launcher window
depends = NOTPROTON_MGF_FC27_LE
tools = notproton-fex-rosetta*
