# NotProton plugin template, for notproton-plugins.sh: EA SPORTS FC 27 with FC 27 Live Editor.
# The first row is the fix's switch, and it does two things while it is on. NotProton loads
# mgf-d3dmetal-hookable.dylib into the game, without which the game closes the moment Live
# Editor puts its DirectX hooks in (d3dmetal-hookable/mgf-d3dmetal-hookable.c). And
# fc27-le-play.sh, which stands before %command% in the launch options, reads the row's
# variable there and starts the game with Live Editor instead of handing Steam's command on.
# The second row loads nothing: it chooses what Play opens. Rosetta tools only: the library
# rewrites x86-64 code, and that is where the game was played.
# install-fc27-live-editor.sh adds "group = MacGameFix · FC 27" to each row where NotProton
# knows groups, so the game's options stand together on its Compatibility page.
# library = mgf-d3dmetal-hookable.dylib
[NOTPROTON_MGF_FC27_LE]
label = Start with Live Editor (MacGameFix)
description = Steam's Play starts EA SPORTS FC 27 with FC 27 Live Editor, a mod tool you provide: offline, without EA AntiCheat or online modes. Off, Play starts the game's own launcher, which starts nothing on a Mac
on = 1
inject = 1
requires = Library/Application Support/notproton/plugins/mgf-d3dmetal-hookable.dylib
tools = notproton-fex-rosetta*
[NOTPROTON_MGF_FC27_OPENS]
label = Play opens (MacGameFix)
description = The game with Live Editor in it (F9 shows its window), or Live Editor's launcher window alone, to look at its settings before a session. Close that window and set this back to play
type = choice
default = game
choice = game = The game
choice = window = Live Editor's launcher window
depends = NOTPROTON_MGF_FC27_LE
tools = notproton-fex-rosetta*
