# NotProton plugin template, for notproton-plugins.sh: EA SPORTS FC 27 with FC 27 Live Editor.
# The first row is the fix's switch, and it does two things while it is on. NotProton loads
# mgf-d3dmetal-hookable.dylib into the game, without which the game closes the moment Live
# Editor puts its DirectX hooks in (d3dmetal-hookable/mgf-d3dmetal-hookable.c). And
# fc27-le-play.sh, which stands before %command% in the launch options, reads the row's
# variable there and starts the game with Live Editor instead of handing Steam's command on.
# The second has NotProton load mgf-package-family.dylib into the game, which gives the
# kernel32.dll Wine maps there the function the game's activation asks for
# (package-family/mgf-package-family.c); it is on from the install, for this game alone, so the
# runner's kernel32.dll need not carry it for every game. The third row loads nothing: it
# chooses what Play opens. The fourth has Wine write the game's exceptions down, for a report. Rosetta tools only: the library rewrites x86-64 code,
# and that is where the game was played. Every description ends with where the row was played,
# as every MacGameFix row in NotProton's panel does.
# install-fc27-live-editor.sh adds "group = MacGameFix · FC 27" to each row where NotProton
# knows groups, so the game's options stand together on its Compatibility page.
# library = mgf-d3dmetal-hookable.dylib
# library = mgf-package-family.dylib
[NOTPROTON_MGF_FC27_LE]
label = Start with Live Editor (MacGameFix)
description = Steam's Play starts EA SPORTS FC 27 with FC 27 Live Editor, a mod tool you provide: offline, without EA AntiCheat or online modes. It also loads the library that rewrites D3DMetal's Direct3D method stubs into a form Live Editor's in-game window can hook; without it the game closes the moment the window goes in. Off, Play starts the game's own launcher, which starts nothing on a Mac. Played on NotProton, CrossOver Preview 41303 on Rosetta (D3DMetal 4.0b3), 2026-11-23
on = 1
inject = 1
requires = Library/Application Support/notproton/plugins/mgf-d3dmetal-hookable.dylib
tools = notproton-fex-rosetta*
[NOTPROTON_MGF_FC27_PACKAGES]
label = Activation fix (MacGameFix)
description = Gives the game the Windows function its activation asks for, FindPackagesByPackageFamily, which Wine 11.21 lacks: without it the game ends at "There is a problem with your game's setup". It loads a library into this game alone that adds the function in memory, so other games keep Wine's own kernel32. Leave it on. Played on NotProton, CrossOver Preview 41303 on Rosetta (D3DMetal 4.0b3), 2026-11-24
on = 1
inject = 1
requires = Library/Application Support/notproton/plugins/mgf-package-family.dylib
tools = notproton-fex-rosetta*
[NOTPROTON_MGF_FC27_OPENS]
label = Play opens (MacGameFix)
description = The game with Live Editor in it (F9 shows its window), or Live Editor's launcher window alone, to look at its settings before a session. Close that window and set this back to play. Played on NotProton, CrossOver Preview 41303 on Rosetta (D3DMetal 4.0b3), 2026-11-23
type = choice
default = game
choice = game = The game
choice = window = Live Editor's launcher window
depends = NOTPROTON_MGF_FC27_LE
tools = notproton-fex-rosetta*
[NOTPROTON_MGF_FC27_TRACE]
label = Exception notes for a report (MacGameFix)
description = For a report of a game that closes: Wine writes every exception the game raises, with times, to NotProton's Wine log for the game. The log grows fast and the game starts slower; leave it off to play. Played on NotProton, CrossOver Preview 41303 on Rosetta (D3DMetal 4.0b3), 2026-11-23
type = choice
default = off
choice = off = Off
choice = on = On, for one start to report
depends = NOTPROTON_MGF_FC27_LE
tools = notproton-fex-rosetta*
