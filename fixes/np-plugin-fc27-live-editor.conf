# NotProton plugin template, for notproton-plugins.sh: EA SPORTS FC 27 with FC 27 Live Editor.
# FC 27 has no row of its own: it uses MacGameFix's shared rows (np-plugin-shared.conf), as few
# as NotProton's 32 for every game allow: "Engine fixes", whose library adds the function the
# game's activation asks for and makes D3DMetal's methods hookable for Live Editor's window,
# without which the game closes the moment Live Editor puts its hooks in; "Start through the mod
# tool", the switch fc27-le-play.sh reads, which stands before %command% in the launch options
# and starts the game with Live Editor; and "Play opens": the game, the game with Wine's
# exception notes for a report, or Live Editor's launcher window ("The game without mods" opens
# the game). This file keeps what the game's descriptor records beyond them.
