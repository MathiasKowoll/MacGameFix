# NotProton plugin template for MacGameFix's shared rows. notproton-plugins.sh writes the records
# some game uses into plugins/mgf-shared.conf, each with "apps" for the games that use it and a
# group where NotProton knows groups. NotProton reads at most 32 rows for every game together, so
# a row that is not one game's own is written once and reused: each game's installer names the
# ones it needs (NP_SHARED_USES), and its play script and the library read them the same way for
# every game. Rosetta tools only: that is where the games were played, on NotProton's 41303
# runner (2026-11-24). Every description is one or two short sentences (the panel shows it whole
# under each row). No label names MacGameFix: the rows' group does, and where NotProton knows no
# groups notproton-plugins.sh ends each label with "(MacGameFix)". "subgroup" is not a field of
# NotProton's: it says which part of the group a row goes under, and is written as
# "group = MacGameFix / <subgroup>".
#
# Engine fixes: loads mgf-engine.dylib (engine/mgf-engine.c), which arms in each game its own
# fixes alone (F1 25, EA SPORTS FC 27, Forza Horizon 6, Phantom Blade Zero). Start through the
# mod tool: the switch a game's play script reads to start the game through the tool its fix set
# up. Play opens: what that start opens; each game's play script reads the choices that apply to
# it and takes the others for "The game". Mod profile:
# which of the tool's profiles a start plays; past its own two choices, the profiles each game's
# installer finds in its tool's folder ("# shared choice:" lines in the game's descriptor,
# notproton-plugins.sh), so the list follows the profiles the player makes.
# Engine fixes is shown on every game's page, with no apps: a game with Denuvo that no fix knows
# needs Rosetta's CPU as its copy protection expects it, which engine patch 0020 gave every game
# from the runner's ntdll.so, and the player switches the row on for it there.
# every game = NOTPROTON_MGF_ENGINE
# The games Engine fixes is for, which NotProton offers the row to when it is off
# (notproton-plugins.sh, "THE GAMES A ROW IS FOR"): each game mgf-engine.dylib has a fix of its
# own for (FIXES[] in engine/mgf-engine.c), and the games with no fix here that were played with
# the row switched on by hand (docs/improvements/games.json). needed_for where the game does
# not start or crashes without it: F1 25 ended 42 to 62 s in, FC 27 at its setup dialog, Phantom
# Blade Zero never opens a window, Persona 4 Golden crashed about 12 s in and STAR WARS: Galactic
# Racer before its first frame. Forza Horizon 6 starts without it, so improves. The other shared
# rows name no game: "Start through the mod tool" is a way to start, not a fix, and NotProton
# allows neither field on a row with a type.
# The builds of mgf-engine.dylib MacGameFix shipped before this one, which an install replaces
# like its own: the two #156 brought (one row of its own, then the shared rows), #158's, #159's,
# #163's, #166's, the one before rosetta-cpu's execution breakpoints, the one before
# enumerator-name, enumerator-name's own (#185 and #192 rebuilt the library without naming the
# build before theirs here, so an install left that one in the folder: found on 2026-11-27) and
# #185's.
# earlier = 5bbc77922be4e98ee2a1d55ccca8ab17f3a3f72b7b424b4fa5b2e2c5f6651589 0a381485d27c3a57d8e6c4160581fbb24995afac6ce0e4f78c2cff45ce50b833 1e76826f3fd618aa21d2ad6867a66f341a677c2b3e50c0bee1952a0d8fc23d55 5504a706d1384a416c06c4d5a32c7ccaaa235b9e7497b8c038ad584acb79fa61 712167382ffaaa571661d6e661da915de6835e252af9fef6359e6701a1dd7fb0 9ce722f560624136227089c3afe790921df59de6c169f4c60b0a5050d329b50f 16b052076a6b14c68455b6ea484d3ee1df39b18f64b32b0eb982db08745ab9d6 8c1c14b4ce68ac2f9108d8d1ae53338ec28757b0db7557d3f3027ee7a030c9d2 0375f1d3dee1aa43abd1f690f0a53b464ea3780e20219142a8f24c19ac9ae658 ca9d18c8fed89526f90d16438c91d3c2028d5066b1693aa9a11c3d40db5b5d6b
[NOTPROTON_MGF_ENGINE]
label = Engine fixes
subgroup = Game fixes
description = Each game gets only its own fixes. Leave it on; turn it on for a game with Denuvo
needed_for = 3059520 The game crashes about a minute after it starts.
needed_for = 4080220 The game stops at start with a setup error.
needed_for = 4115450 The game never opens a window.
needed_for = 1113000 The game crashes about 12 seconds after it starts.
needed_for = 4078430 The game closes before its first frame.
improves = 2483190 Online sessions connect, and an idle timer thread stops using the processor.
on = 1
inject = 1
requires = Library/Application Support/notproton/plugins/mgf-engine.dylib
tools = notproton-fex-rosetta*
[NOTPROTON_MGF_MODTOOL]
label = Start through the mod tool
subgroup = Mods
description = Play starts the game through its mod tool, offline. Off, the game starts on its own
on = 1
tools = notproton-fex-rosetta*
[NOTPROTON_MGF_PLAY]
label = Play opens
subgroup = Mods
description = What Play opens when it starts through the mod tool
type = choice
default = game
choice = game = The game
choice = notes = The game, with exception notes for a report
choice = window = The mod tool's window
depends = NOTPROTON_MGF_MODTOOL
tools = notproton-fex-rosetta*
[NOTPROTON_MGF_PROFILE]
label = Mod profile
subgroup = Mods
description = The mod tool's profile to play
type = choice
default = active
choice = active = The tool's active profile
choice = vanilla = Vanilla, without mods
depends = NOTPROTON_MGF_MODTOOL
tools = notproton-fex-rosetta*
