# NotProton plugin template for MacGameFix's shared rows. notproton-plugins.sh writes the records
# some game uses into plugins/mgf-shared.conf, each with "apps" for the games that use it and a
# group where NotProton knows groups. NotProton reads at most 32 rows for every game together, so
# a row that is not one game's own is written once and reused: each game's installer names the
# ones it needs (NP_SHARED_USES), and its play script and the library read them the same way for
# every game. Rosetta tools only: that is where the games were played. Every description ends
# with where the row was played, as every MacGameFix row in NotProton's panel does.
#
# Engine fixes: loads mgf-engine.dylib (engine/mgf-engine.c), which arms in each game its own
# fixes alone (F1 25, EA SPORTS FC 27, Forza Horizon 6, Phantom Blade Zero). Start through the
# mod tool: the switch a game's play script reads to start the game through the tool its fix set
# up. Play opens: what that start opens; each game's play script reads the choices that apply to
# it and takes the others for "The game". Mod profile:
# which of the tool's profiles a start plays; past its own two choices, the profiles each game's
# installer finds in its tool's folder ("# shared choice:" lines in the game's descriptor,
# notproton-plugins.sh), so the list follows the profiles the player makes.
# Engine fixes is shown on every game's page, with no apps: a game with Denuvo that no fix knows
# needs Rosetta's CPU as its copy protection expects it, which engine patch 0020 gave every game
# from the runner's ntdll.so, and the player switches the row on for it there.
# every game = NOTPROTON_MGF_ENGINE
# The builds of mgf-engine.dylib MacGameFix shipped before this one, which an install replaces
# like its own: the two #156 brought (one row of its own, then the shared rows), #158's and #159's.
# earlier = 5bbc77922be4e98ee2a1d55ccca8ab17f3a3f72b7b424b4fa5b2e2c5f6651589 0a381485d27c3a57d8e6c4160581fbb24995afac6ce0e4f78c2cff45ce50b833 1e76826f3fd618aa21d2ad6867a66f341a677c2b3e50c0bee1952a0d8fc23d55 5504a706d1384a416c06c4d5a32c7ccaaa235b9e7497b8c038ad584acb79fa61 712167382ffaaa571661d6e661da915de6835e252af9fef6359e6701a1dd7fb0 9ce722f560624136227089c3afe790921df59de6c169f4c60b0a5050d329b50f
[NOTPROTON_MGF_ENGINE]
label = Engine fixes (MacGameFix)
description = The fixes a game needs that Wine lacks, from one MacGameFix library that arms each game's own in that game alone: F1 25's memory kept where Windows puts it; for EA SPORTS FC 27 the function its activation asks for, and D3DMetal's methods made hookable for Live Editor's window; for Forza Horizon 6 the timer thread kept from spinning, the IPv4 options of its online sessions, and its protection's system calls kept when Rosetta delivers them on top of a suspend; for Phantom Blade Zero, Rosetta's CPU shown as its copy protection expects it (those two games checked with test programs, not yet played with the row). In every game it is on for, Rosetta's CPU as Denuvo expects it (switch it on for a game with Denuvo that has no fix of its own, such as STAR WARS: Galactic Racer or Persona 4 Golden), and Wine no longer ends the game when a mod tool changes its memory as it starts (F1 25 through Swofty Launcher's offline play). Off, F1 25 and FC 27 close or refuse to start. Leave it on. Played on NotProton, CrossOver Preview 41303 on Rosetta (D3DMetal 4.0b3), 2026-11-24
on = 1
inject = 1
requires = Library/Application Support/notproton/plugins/mgf-engine.dylib
tools = notproton-fex-rosetta*
[NOTPROTON_MGF_MODTOOL]
label = Start through the mod tool (MacGameFix)
description = Steam's Play starts the game through the mod tool MacGameFix set up for it, offline and without EA AntiCheat: F1 25 through Swofty Launcher, EA SPORTS FC 27 with FC 27 Live Editor. Off, Play starts the game's own launcher, which starts nothing on a Mac. Played on NotProton, CrossOver Preview 41303 on Rosetta (D3DMetal 4.0b3), 2026-11-24
on = 1
tools = notproton-fex-rosetta*
[NOTPROTON_MGF_PLAY]
label = Play opens (MacGameFix)
description = The game; the game with Wine writing every exception it raises to NotProton's Wine log, for one start to report a game that closes; or the mod tool's window (Swofty Launcher, or FC 27 Live Editor's launcher), to set it up before a session. Played on NotProton, CrossOver Preview 41303 on Rosetta (D3DMetal 4.0b3), 2026-11-24
type = choice
default = game
choice = game = The game
choice = notes = The game, with exception notes for a report
choice = window = The mod tool's window
depends = NOTPROTON_MGF_MODTOOL
tools = notproton-fex-rosetta*
[NOTPROTON_MGF_PROFILE]
label = Mod profile (MacGameFix)
description = Which of the mod tool's profiles a start plays: its active one; vanilla, the game with no addons and no mod loader, to tell whether a problem comes from a mod; or one of your profiles by name (F1 25: Swofty Launcher's). A profile you make in the tool's window shows here after MacGameFix next looks at the fix; a name with characters other than letters, digits, dot, dash and underscore is not offered. Played on NotProton, CrossOver Preview 41303 on Rosetta (D3DMetal 4.0b3), 2026-11-24
type = choice
default = active
choice = active = The tool's active profile
choice = vanilla = Vanilla, without mods
depends = NOTPROTON_MGF_MODTOOL
tools = notproton-fex-rosetta*
