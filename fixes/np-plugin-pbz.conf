# NotProton plugin template, for notproton-plugins.sh: Phantom Blade Zero.
# PBZ has no row of its own: it uses MacGameFix's shared "Engine fixes" row (np-plugin-shared.conf),
# whose library, mgf-engine.dylib, arms in this game alone what engine patches 0017, 0019 and 0020
# do in the Wine modules' ntdll: Rosetta's CPUID leaf 7 with CLFLUSHOPT, CLWB and RDPID, CLWB and
# RDPID emulated, non-canonical faults reported as Windows reports them, and the CPUID Rosetta
# skips after self-modifying code. This file keeps what the game's descriptor records beyond it.
